<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structural Vibration Signal Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --accent-green: #4ade80;
            --border-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .chart-wrapper {
            position: relative;
            height: 350px;
            width: 100%;
            margin-bottom: 20px;
        }

        .stats-panel {
            display: flex;
            justify-content: space-around;
            padding: 20px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
            text-align: center;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .stat-value {
            font-family: monospace;
            font-size: 1.2em;
            color: var(--text-main);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .control-label {
            font-size: 1em;
        }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 130px;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 10px;
            border-radius: 2px;
            background: #fff;
            cursor: pointer;
            margin-top: -8px;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #555;
            border-radius: 2px;
        }

        .value-display {
            background: #2a2a2a;
            padding: 8px 15px;
            border-radius: 8px;
            font-family: monospace;
            min-width: 40px;
            text-align: center;
        }

        /* Toggle Switch Styling */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--text-main);
        }

        input:checked+.slider:before {
            transform: translateX(24px);
            background-color: #000;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="chart-wrapper">
            <canvas id="signalChart"></canvas>
        </div>

        <div class="stats-panel">
            <div>
                <div class="stat-label">Sequence Length</div>
                <div class="stat-value" id="seqLength">150 pts</div>
            </div>
            <div>
                <div class="stat-label">Status</div>
                <div class="stat-value" id="damageStatus">Healthy Baseline</div>
            </div>
        </div>

        <div class="controls-grid">
            <div class="control-group">
                <div class="control-label">Sampling Rate (Hz)</div>
                <input type="range" id="sampleRate" min="50" max="500" step="10" value="150">
                <div class="value-display" id="sampleRateVal">150</div>
            </div>

            <div class="control-group">
                <div class="control-label">Ambient Noise (SNR)</div>
                <input type="range" id="noiseLevel" min="0" max="5" step="0.1" value="1.2">
                <div class="value-display" id="noiseVal">1.2</div>
            </div>

            <div class="control-group">
                <div class="control-label">Apply Transient Load</div>
                <label class="switch">
                    <input type="checkbox" id="transientToggle">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="control-group">
                <div class="control-label">Introduce Structural Damage</div>
                <label class="switch">
                    <input type="checkbox" id="damageToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('signalChart').getContext('2d');

        // State variables
        let fs = 150;
        let noise = 1.2;
        let hasDamage = false;
        let hasTransient = false;

        // Generate signal physics
        function generateSignal() {
            const data = [];
            const duration = 3.0; // 3 seconds
            const dt = 1 / fs;
            const baseFreq = hasDamage ? 3.5 : 4.0; // Damage shifts frequency down

            for (let t = 0; t <= duration; t += dt) {
                // Clean harmonic mode
                let y = Math.sin(2 * Math.PI * baseFreq * t);

                // Apply Transient Load (decaying exponential burst at t=1.0s)
                if (hasTransient && t >= 1.0) {
                    const t_trans = t - 1.0;
                    y += 2.0 * Math.exp(-3 * t_trans) * Math.sin(2 * Math.PI * 15 * t_trans);
                }

                // Add broadband noise
                y += (Math.random() - 0.5) * noise * 1.5;

                data.push({ x: t.toFixed(3), y: y });
            }
            return data;
        }

        // Chart.js Custom Plugin to draw the vertical transient line
        const transientLinePlugin = {
            id: 'transientLine',
            beforeDraw: (chart) => {
                if (!hasTransient) return;
                const ctx = chart.ctx;
                const xAxis = chart.scales.x;
                const yAxis = chart.scales.y;

                // Find pixel coordinate for t=1.0s
                // Since data is evenly spaced, we calculate the ratio
                const xPos = xAxis.left + (xAxis.right - xAxis.left) * (1.0 / 3.0);

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(xPos, yAxis.top);
                ctx.lineTo(xPos, yAxis.bottom);
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#888';
                ctx.setLineDash([5, 5]);
                ctx.stroke();

                // Add Text
                ctx.fillStyle = '#fff';
                ctx.font = '12px sans-serif';
                ctx.fillText('Transient Load ↑', xPos + 10, yAxis.top + 20);
                ctx.restore();
            }
        };

        // Initialize Chart
        const signalChart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [{
                    label: 'Amplitude (g)',
                    data: generateSignal(),
                    borderColor: '#4ade80',
                    borderWidth: 1.5,
                    pointRadius: 0, // Hide points to look like raw sensor data
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                interaction: { intersect: false },
                scales: {
                    x: {
                        type: 'linear',
                        min: 0,
                        max: 3,
                        grid: { color: '#333' },
                        ticks: { color: '#888' }
                    },
                    y: {
                        min: -4,
                        max: 4,
                        grid: { color: '#333' },
                        ticks: { color: '#888' },
                        title: {
                            display: true,
                            text: 'Amplitude (g) ↑',
                            color: '#888',
                            align: 'end'
                        }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            },
            plugins: [transientLinePlugin]
        });

        // Update functions
        function updateUI() {
            document.getElementById('seqLength').innerText = `${fs * 3} pts`;

            const statusEl = document.getElementById('damageStatus');
            if (hasDamage) {
                statusEl.innerText = 'Damage Detected';
                statusEl.style.color = '#dc3545';
            } else {
                statusEl.innerText = 'Healthy Baseline';
                statusEl.style.color = 'var(--text-main)';
            }

            signalChart.data.datasets[0].data = generateSignal();
            signalChart.update();
        }

        // Event Listeners
        document.getElementById('sampleRate').addEventListener('input', (e) => {
            fs = parseInt(e.target.value);
            document.getElementById('sampleRateVal').innerText = fs;
            updateUI();
        });

        document.getElementById('noiseLevel').addEventListener('input', (e) => {
            noise = parseFloat(e.target.value);
            document.getElementById('noiseVal').innerText = noise.toFixed(1);
            updateUI();
        });

        document.getElementById('transientToggle').addEventListener('change', (e) => {
            hasTransient = e.target.checked;
            updateUI();
        });

        document.getElementById('damageToggle').addEventListener('change', (e) => {
            hasDamage = e.target.checked;
            updateUI();
        });

        // Initial render
        updateUI();

    </script>
</body>

</html>
