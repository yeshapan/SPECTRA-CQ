name: Deploy Interactive Visuals to Pages

on:
  push:
    branches: ["main"] # Triggers deployment every time you push to main
  workflow_dispatch: # Allows you to manually trigger it from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Crucial step: Point this exactly to your custom folder!
          path: './interactive_visuals'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4